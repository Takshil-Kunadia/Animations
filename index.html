<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Card Animations</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="lightbox.css">
	<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
	<!-- Entrance Screen -->
	<div id="entrance-screen" class="entrance-screen">
		<div class="entrance-content">
			<h1 class="entrance-title">Sanatan</h1>
			<p class="entrance-subtitle">तत् त्वम् असि</p>
			<button id="enter-button" class="enter-button">
				<img height="50px" width="50px" src="./Assets/om-symbol.svg" alt="ॐ" class="om-symbol">
				<div class="button-ripple"></div>
			</button>
		</div>
		<div class="entrance-particles"></div>
	</div>

	<!-- Main Content (hidden initially) -->
	<h1 id="animation-title">Enlightenment</h1>
	<video id="bg-video" loop playsinline muted>
		<source src="./Assets/bg-video.webm" type="video/webm" />
	</video>
	<div id="main-content" class="main-content hidden">
		<div class="card-group">
			<div class="little-card card"></div>
			<div class="big-card card"></div>
			<div class="little-card card"></div>
			<div class="big-card card"></div>
			<div class="little-card card"></div>
			<div class="big-card card"></div> 
			<div class="little-card card"></div>
			<div class="big-card card"></div>
		</div>
	</div>

	<!-- External JavaScript -->
	<script src="script.js"></script>
	<script src="lightbox.js"></script>
</body>
</html>
