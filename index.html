<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Card Animations</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- Entrance Screen -->
	<div id="entrance-screen" class="entrance-screen">
		<div class="entrance-content">
			<h1 class="entrance-title">Enlightenment</h1>
			<p class="entrance-subtitle">Experience the Journey</p>
			<button id="enter-button" class="enter-button">
				<span class="button-text">ॐ</span>
				<div class="button-ripple"></div>
			</button>
		</div>
		<div class="entrance-particles"></div>
	</div>

	<!-- Main Content (hidden initially) -->
	<h1 id="animation-title">Enlightenment</h1>
	<video id="bg-video" loop playsinline muted>
		<source src="./Assets/bg-video.webm" type="video/webm" />
	</video>
	<div id="main-content" class="main-content hidden">
		<div class="card-group">
			<div class="little-card card"></div>
			<div class="big-card card"></div>
			<div class="little-card card"></div>
			<div class="big-card card"></div>
			<div class="little-card card"></div>
			<div class="big-card card"></div> 
			<div class="little-card card"></div>
			<div class="big-card card"></div>
		</div>
	</div>

	<script>
		document.getElementById('enter-button').addEventListener('click', function() {
			const entranceScreen = document.getElementById('entrance-screen');
			const mainContent = document.getElementById('main-content');
			const video = document.getElementById('bg-video');
			const title = document.getElementById('animation-title');
			
			// Add exit animation to entrance screen
			entranceScreen.classList.add('exit-animation');
			
			// After animation completes, switch to main content
			setTimeout(() => {
				entranceScreen.style.display = 'none';
				
				// Show and animate the title
				title.classList.add('show');
				
				// Show and animate the video
				video.classList.add('show');
				
				// Show main content with animation
				mainContent.classList.remove('hidden');
				mainContent.classList.add('enter-animation');
				
				// Start video with audio after a brief delay
				setTimeout(() => {
					video.muted = false;
					video.play().catch(e => {
						// Fallback: if unmuted autoplay fails, play muted
						video.muted = true;
						video.play();
					});
				}, 500);
			}, 1000);
		});
	</script>
</body>
</html>
